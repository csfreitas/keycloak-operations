server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional same-origin API proxy to backend Service (OpenShift DNS)
    # Uncomment / set when UI and API share a hostname via ingress path routing.
    # location /api/ {
    #     proxy_pass http://keycloak-operations-mcp:8081/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_buffering off;
    # }
    # location /api/v1/events {
    #     proxy_pass http://keycloak-operations-mcp:8081/api/v1/events;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection '';
    #     proxy_buffering off;
    #     chunked_transfer_encoding off;
    # }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
