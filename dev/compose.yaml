name: keycloak-operations

services:
  postgres:
    image: postgres:16
    container_name: keycloak-operations-postgres
    labels:
      io.github.keycloak-operations.component: postgres
      io.github.keycloak-operations.environment: local-development
    environment:
      POSTGRES_DB: kcops
      POSTGRES_USER: kcops
      POSTGRES_PASSWORD: kcops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcops -d kcops"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak-operations-keycloak-a
    labels:
      io.github.keycloak-operations.component: keycloak-a
      io.github.keycloak-operations.environment: local-development
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_METRICS_HISTOGRAMS_ENABLED: "true"
      # Optional event metrics — keep cardinality low in lab
      KC_EVENT_METRICS_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:Z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Second Keycloak for multi-target isolation demos.
  # Start with: podman compose -f dev/compose.yaml --profile multi-target up -d
  keycloak-b:
    profiles: ["multi-target"]
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak-operations-keycloak-b
    labels:
      io.github.keycloak-operations.component: keycloak-b
      io.github.keycloak-operations.environment: local-development
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_METRICS_HISTOGRAMS_ENABLED: "true"
      # Optional event metrics — keep cardinality low in lab
      KC_EVENT_METRICS_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - "8180:8080"
      - "9002:9000"
    volumes:
      - ./keycloak-b/import:/opt/keycloak/data/import:Z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: keycloak-operations-prometheus
    labels:
      io.github.keycloak-operations.component: prometheus
      io.github.keycloak-operations.environment: local-development
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z
      - prometheus-data:/prometheus
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q 'Prometheus Server is Healthy' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres-data:
    name: keycloak-operations-postgres-data
    labels:
      io.github.keycloak-operations.component: postgres-data
      io.github.keycloak-operations.environment: local-development
      io.github.keycloak-operations.reusable: "true"
  prometheus-data:
    name: keycloak-operations-prometheus-data
    labels:
      io.github.keycloak-operations.component: prometheus-data
      io.github.keycloak-operations.environment: local-development
      io.github.keycloak-operations.reusable: "true"
