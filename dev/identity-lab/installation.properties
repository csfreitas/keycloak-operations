# Disposable synthetic-cluster validation only; never production credentials or endpoints.
quarkus.http.port=${INSTALLATION_LAB_HTTP_PORT:18081}
quarkus.management.port=${INSTALLATION_LAB_MANAGEMENT_PORT:19001}
quarkus.http.cors.origins=http://127.0.0.1:18300
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=http://localhost:18280/realms/operations
quarkus.oidc.client-id=keycloak-operations
quarkus.oidc.token.audience=keycloak-operations
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/kcops
quarkus.otel.sdk.disabled=true
platform.authorization.grants.ops-a.targets=lab-keycloak-a
platform.authorization.grants.ops-a.permissions=READ,ASSESS
platform.authorization.grants.ops-b.targets=lab-keycloak-b
platform.authorization.grants.ops-b.permissions=READ,ASSESS
platform.authorization.grants.setup-a.targets=lab-keycloak-a
platform.authorization.grants.setup-a.permissions=READ,DISCOVER,BIND
platform.authorization.grants.setup-b.targets=lab-keycloak-b
platform.authorization.grants.setup-b.permissions=READ,DISCOVER,BIND
platform.authorization.grants.setup-both.targets=lab-keycloak-a,lab-keycloak-b
platform.authorization.grants.setup-both.permissions=READ,DISCOVER,BIND
platform.authorization.grants.bind-only.targets=lab-keycloak-a
platform.authorization.grants.bind-only.permissions=READ,BIND
# False only in the runner's dedicated setup process. No WRITE/ADMIN/APPROVE grants.
mcp.read-only=${INSTALLATION_LAB_READ_ONLY:true}
mcp.targets.lab-keycloak-a.observability.metrics.type=NONE
mcp.targets.lab-keycloak-b.observability.metrics.type=NONE
mcp.targets.lab-keycloak-a.keycloak.url=http://localhost:18080
mcp.targets.lab-keycloak-a.keycloak.auth-realm=target-a
mcp.targets.lab-keycloak-a.keycloak.client-id=operations-reader
mcp.credentials.lab-a.client-secret=local-target-a
mcp.targets.lab-keycloak-b.keycloak.url=http://localhost:18180
mcp.targets.lab-keycloak-b.keycloak.auth-realm=target-b
mcp.targets.lab-keycloak-b.keycloak.client-id=operations-reader
mcp.credentials.lab-b.client-secret=local-target-b
mcp.targets.lab-keycloak-a.infrastructure.type=KUBERNETES
mcp.targets.lab-keycloak-a.infrastructure.cluster-id=synthetic-local-cluster
mcp.targets.lab-keycloak-a.infrastructure.namespace=lab-a
mcp.targets.lab-keycloak-a.infrastructure.credential-ref=installation-fixture
mcp.targets.lab-keycloak-b.infrastructure.type=KUBERNETES
mcp.targets.lab-keycloak-b.infrastructure.cluster-id=synthetic-local-cluster
mcp.targets.lab-keycloak-b.infrastructure.namespace=lab-b
mcp.targets.lab-keycloak-b.infrastructure.credential-ref=installation-fixture
mcp.credentials.installation-fixture.token=local-installation-cluster
mcp.credentials.installation-fixture.api-server-url=http://127.0.0.1:18590
