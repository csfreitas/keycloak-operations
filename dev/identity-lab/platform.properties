# Public local fixtures only. Use with the oidc profile, never production.
quarkus.http.port=18081
quarkus.management.port=19001
quarkus.http.cors.origins=http://127.0.0.1:18300
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=http://localhost:18280/realms/operations
quarkus.oidc.client-id=keycloak-operations
quarkus.oidc.token.audience=keycloak-operations
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/kcops
platform.authorization.grants.ops-a.targets=lab-keycloak-a
platform.authorization.grants.ops-a.permissions=READ,ASSESS
platform.authorization.grants.ops-b.targets=lab-keycloak-b
platform.authorization.grants.ops-b.permissions=READ,ASSESS
mcp.read-only=true
# Do not inherit the regular lab's Prometheus endpoint on port 9090.
mcp.targets.lab-keycloak-a.observability.metrics.type=${IDENTITY_LAB_METRICS_TYPE:NONE}
mcp.targets.lab-keycloak-a.observability.metrics.endpoint=http://127.0.0.1:18490
mcp.targets.lab-keycloak-b.observability.metrics.type=NONE
mcp.targets.lab-keycloak-a.keycloak.url=http://localhost:18080
mcp.targets.lab-keycloak-a.keycloak.auth-realm=target-a
mcp.targets.lab-keycloak-a.keycloak.client-id=operations-reader
mcp.credentials.lab-a.client-secret=local-target-a
mcp.targets.lab-keycloak-b.keycloak.url=http://localhost:18180
mcp.targets.lab-keycloak-b.keycloak.auth-realm=target-b
mcp.targets.lab-keycloak-b.keycloak.client-id=operations-reader
mcp.credentials.lab-b.client-secret=local-target-b
quarkus.otel.sdk.disabled=true
# Explicit disposable demonstration policy, not a production recommendation.
assessment.performance.heap-utilization-warning-percent=85
