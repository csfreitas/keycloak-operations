# Disposable local fixture only. No legacy target grants or external metrics.
quarkus.http.port=18081
quarkus.management.port=19001
quarkus.http.cors.origins=http://127.0.0.1:18300
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=http://localhost:18280/realms/operations
quarkus.oidc.client-id=keycloak-operations
quarkus.oidc.token.audience=keycloak-operations
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/kcops
mcp.read-only=true
mcp.targets.lab-keycloak-a.observability.metrics.type=NONE
mcp.targets.lab-keycloak-b.observability.metrics.type=NONE
mcp.targets.lab-keycloak-a.keycloak.url=http://localhost:18080
mcp.targets.lab-keycloak-a.keycloak.auth-realm=target-a
mcp.targets.lab-keycloak-a.keycloak.client-id=configuration-reader
mcp.credentials.lab-a.client-secret=local-configuration-reader
mcp.targets.lab-keycloak-b.keycloak.url=http://localhost:18180
mcp.targets.lab-keycloak-b.keycloak.auth-realm=target-b
mcp.targets.lab-keycloak-b.keycloak.client-id=operations-reader
mcp.credentials.lab-b.client-secret=local-target-b
quarkus.otel.sdk.disabled=true

platform.configuration-reads.scopes.realm-settings.role=config-realm
platform.configuration-reads.scopes.realm-settings.target-id=lab-keycloak-a
platform.configuration-reads.scopes.realm-settings.realm=target-a
platform.configuration-reads.scopes.realm-settings.realm-id=agt2-realm-a-v1
platform.configuration-reads.scopes.realm-settings.kind=REALM
platform.configuration-reads.scopes.realm-settings.fields=registrationAllowed,resetPasswordAllowed,bruteForceProtected,verifyEmail
platform.configuration-reads.scopes.realm-settings.rest-client-ids=keycloak-ops-ui
platform.configuration-reads.scopes.realm-settings.mcp-client-ids=keycloak-config-mcp

platform.configuration-reads.scopes.realm-stale.role=config-realm
