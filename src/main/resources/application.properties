# Keycloak / RHBK Operations MCP Server 0.5.0
quarkus.application.name=keycloak-operations-mcp
quarkus.application.version=0.5.0

# HTTP / management
quarkus.http.port=8081
quarkus.http.host=0.0.0.0
quarkus.management.enabled=true
quarkus.management.port=9001

# MCP Streamable HTTP
quarkus.mcp.server.server-info.name=keycloak-operations-mcp
quarkus.mcp.server.server-info.version=0.5.0
quarkus.mcp.server.traffic-logging.enabled=true
quarkus.mcp.server.traffic-logging.text-limit=200

# Health & metrics
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=false

# Logging — never log secrets
quarkus.log.level=INFO
quarkus.log.category."io.github.keycloakmcp".level=INFO
quarkus.log.category."org.keycloak".level=WARN

# Global read-only mode (0.1.0)
mcp.read-only=${MCP_READ_ONLY:true}

# --- Credentials (never returned to LLMs; referenced by credential-ref) ---
mcp.credentials.lab-a.client-secret=${LAB_KEYCLOAK_A_CLIENT_SECRET:${KEYCLOAK_CLIENT_SECRET:change-me}}
mcp.credentials.lab-b.client-secret=${LAB_KEYCLOAK_B_CLIENT_SECRET:${KEYCLOAK_CLIENT_SECRET_B:change-me}}

# --- Target A: primary local Keycloak (compose service keycloak / :8080) ---
mcp.targets.lab-keycloak-a.display-name=Lab Keycloak A
mcp.targets.lab-keycloak-a.type=KEYCLOAK
mcp.targets.lab-keycloak-a.environment=DEV
mcp.targets.lab-keycloak-a.enabled=true
mcp.targets.lab-keycloak-a.keycloak.url=${LAB_KEYCLOAK_A_URL:${KEYCLOAK_URL:http://localhost:8080}}
mcp.targets.lab-keycloak-a.keycloak.auth-realm=${LAB_KEYCLOAK_A_AUTH_REALM:master}
mcp.targets.lab-keycloak-a.keycloak.client-id=${LAB_KEYCLOAK_A_CLIENT_ID:keycloak-mcp}
mcp.targets.lab-keycloak-a.keycloak.credential-ref=lab-a
mcp.targets.lab-keycloak-a.tags.customer=lab
mcp.targets.lab-keycloak-a.tags.instance=a

# --- Target B: second Keycloak (compose profile multi-target / :8180) ---
mcp.targets.lab-keycloak-b.display-name=Lab Keycloak B
mcp.targets.lab-keycloak-b.type=KEYCLOAK
mcp.targets.lab-keycloak-b.environment=TEST
mcp.targets.lab-keycloak-b.enabled=true
mcp.targets.lab-keycloak-b.keycloak.url=${LAB_KEYCLOAK_B_URL:http://localhost:8180}
mcp.targets.lab-keycloak-b.keycloak.auth-realm=${LAB_KEYCLOAK_B_AUTH_REALM:master}
mcp.targets.lab-keycloak-b.keycloak.client-id=${LAB_KEYCLOAK_B_CLIENT_ID:keycloak-mcp}
mcp.targets.lab-keycloak-b.keycloak.credential-ref=lab-b
mcp.targets.lab-keycloak-b.tags.customer=lab
mcp.targets.lab-keycloak-b.tags.instance=b

# Assessment engine
assessment.rules.path=rules
assessment.default-profile=keycloak-production
assessment.max-realms=50
assessment.max-clients-per-realm=100
assessment.expected-availability-zones=AUTO
assessment.include-master-realm=false

# Target health checks
health.pods.restart-warning-threshold=3
health.management.connect-timeout-ms=3000
health.management.read-timeout-ms=5000

# Environment discovery
discovery.kubernetes.enabled=${DISCOVERY_KUBERNETES_ENABLED:false}
discovery.openshift.enabled=${DISCOVERY_OPENSHIFT_ENABLED:false}

# --- Platform / persistence ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:kcops}
quarkus.datasource.password=${POSTGRES_PASSWORD:kcops}
# JDBC URL only for dev/prod — omit in %test so Dev Services can start Postgres
%dev.quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/kcops}
%prod.quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/kcops}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.devservices.enabled=false
%test.quarkus.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.datasource.devservices.image-name=postgres:16

mcp.target.registry=${MCP_TARGET_REGISTRY:composite}
platform.target-registry=${MCP_TARGET_REGISTRY:composite}
platform.audit.enabled=true
platform.audit.mode=SANITIZED
# Retention defaults (days) — documented; enforcement job TBD
platform.retention.assessment-days=365
platform.retention.health-check-days=90
platform.retention.audit-days=90
platform.retention.snapshot-days=180

# ConfigMapping prefix "platform" must tolerate Quarkus Platform keys (platform.quarkus.*)
smallrye.config.mapping.validate-unknown=false

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=Keycloak Operations Platform API
mp.openapi.extensions.smallrye.info.version=0.5.0

quarkus.devservices.enabled=false
%test.quarkus.otel.enabled=false
%test.mcp.read-only=true
%test.mcp.credentials.lab-a.client-secret=test-secret-a
%test.mcp.credentials.lab-b.client-secret=test-secret-b
%test.mcp.targets.lab-keycloak-a.display-name=Test Keycloak A
%test.mcp.targets.lab-keycloak-a.type=KEYCLOAK
%test.mcp.targets.lab-keycloak-a.environment=TEST
%test.mcp.targets.lab-keycloak-a.enabled=true
%test.mcp.targets.lab-keycloak-a.keycloak.url=http://localhost:8080
%test.mcp.targets.lab-keycloak-a.keycloak.auth-realm=master
%test.mcp.targets.lab-keycloak-a.keycloak.client-id=keycloak-mcp
%test.mcp.targets.lab-keycloak-a.keycloak.credential-ref=lab-a
%test.mcp.targets.lab-keycloak-b.display-name=Test Keycloak B
%test.mcp.targets.lab-keycloak-b.type=KEYCLOAK
%test.mcp.targets.lab-keycloak-b.environment=TEST
%test.mcp.targets.lab-keycloak-b.enabled=true
%test.mcp.targets.lab-keycloak-b.keycloak.url=http://localhost:8180
%test.mcp.targets.lab-keycloak-b.keycloak.auth-realm=master
%test.mcp.targets.lab-keycloak-b.keycloak.client-id=keycloak-mcp
%test.mcp.targets.lab-keycloak-b.keycloak.credential-ref=lab-b
