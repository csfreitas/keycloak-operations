# OpenShift High Availability rules
rules:
  - id: KC-OCP-HA-001
    title: Minimum Keycloak replicas for HA
    category: high-availability
    severity: HIGH
    description: >
      Production Keycloak / RHBK on OpenShift should run with at least two
      replicas so a single pod failure does not take the identity plane offline.
    impact: >
      A single-replica deployment is a single point of failure for authentication
      and token issuance.
    recommendation: >
      Scale the Keycloak Deployment or StatefulSet to at least 2 replicas
      (prefer 3 for rolling updates without capacity loss) and verify Pod
      Disruption Budgets and anti-affinity.
    references:
      - https://www.keycloak.org/high-availability/introduction
      - https://docs.redhat.com/en/documentation/red_hat_build_of_keycloak
    condition:
      key: deployment.replicas
      lessThan: 2
    appliesWhen:
      runtime:
        - OPENSHIFT
        - KUBERNETES
