# Performance / SLO rules. Fire only when evidence exists (boolean findings from MetricsEvidenceCollector).
id: performance
rules:
  - id: KC-PERF-HTTP-001
    title: HTTP p99 latency exceeds SLO
    category: performance
    severity: HIGH
    description: >
      Observed HTTP p99 latency exceeds the configured assessment.performance.latency-p99-ms SLO.
    impact: >
      Users may experience slow login and token responses under load.
    recommendation: >
      Investigate hot paths, enable HTTP histograms if missing, tune pool/heap, or raise the SLO if unrealistic.
    references: []
    condition:
      key: metrics.slo.p99Exceeded
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.slo.p99Configured
        - metrics.http.p99Ms
        - metrics.slo.p99Exceeded

  - id: KC-PERF-HTTP-002
    title: HTTP server error rate exceeds SLO
    category: performance
    severity: HIGH
    description: >
      Server error rate percent exceeds the configured assessment.performance.server-error-rate-percent.
    impact: >
      Elevated 5xx rates degrade authentication availability.
    recommendation: >
      Check Keycloak logs, upstream dependencies, and recent configuration changes.
    references: []
    condition:
      key: metrics.slo.errorRateExceeded
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.slo.errorRateExceeded

  - id: KC-PERF-HTTP-HIST-001
    title: HTTP latency histograms required but missing
    category: performance
    severity: MEDIUM
    description: >
      A p99 latency SLO is configured but histogram bucket series are unavailable,
      so percentile latency cannot be evaluated.
    impact: >
      Performance SLOs based on percentiles cannot be enforced.
    recommendation: >
      Enable KC_HTTP_METRICS_HISTOGRAMS_ENABLED (or equivalent) and ensure Prometheus scrapes buckets.
    references: []
    condition:
      key: metrics.http.histogram.requiredButMissing
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.slo.p99Configured
        - metrics.http.histogram.requiredButMissing

  - id: KC-PERF-DB-001
    title: Database pool awaiting connections elevated
    category: performance
    severity: MEDIUM
    description: >
      Agroal awaiting connection count is at or above the configured warning threshold.
    impact: >
      Request threads may block waiting for DB connections, increasing latency.
    recommendation: >
      Increase pool size, reduce connection hold time, or investigate slow queries.
    references: []
    condition:
      key: metrics.db.awaitingWarning
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.db.awaitingWarning

  - id: KC-PERF-JVM-001
    title: JVM heap pressure
    category: performance
    severity: MEDIUM
    description: >
      Heap utilization is at or above the configured warning percent.
    impact: >
      Elevated GC pause risk and potential OutOfMemory errors under load.
    recommendation: >
      Increase heap / memory limits or investigate retention and cache sizing.
    references: []
    condition:
      key: metrics.jvm.heapPressure
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.jvm.heapPressure

  - id: KC-PERF-CACHE-001
    title: Cache hit ratio below minimum
    category: performance
    severity: LOW
    description: >
      Cache hit ratio is below the configured minimum.
    impact: >
      More backend load and higher latency for identity lookups.
    recommendation: >
      Review cache sizing and invalidation patterns.
    references: []
    condition:
      key: metrics.cache.hitRatioBelowMinimum
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.cache.hitRatioBelowMinimum

  - id: KC-PERF-HTTP-P95-001
    title: HTTP p95 latency exceeds SLO
    category: performance
    severity: MEDIUM
    description: >
      Observed HTTP p95 latency exceeds the configured assessment.performance.latency-p95-ms SLO.
    impact: >
      Elevated tail latency for typical authentication traffic.
    recommendation: >
      Investigate hot paths and pool/heap pressure; raise the SLO only if unrealistic.
    references: []
    condition:
      key: metrics.slo.p95Exceeded
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.slo.p95Configured
        - metrics.http.p95Ms
        - metrics.slo.p95Exceeded

  - id: KC-PERF-DB-002
    title: Database pool awaiting connections critical
    category: performance
    severity: HIGH
    description: >
      Agroal awaiting connections reached the configured critical threshold with sustained average pressure.
    impact: >
      Request threads are likely blocking on the connection pool.
    recommendation: >
      Investigate slow queries and connection hold time before increasing pool size.
    references: []
    condition:
      key: metrics.db.awaitingCritical
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.db.awaitingCritical

  - id: KC-PERF-GC-001
    title: Configured GC pause threshold exceeded
    category: performance
    severity: MEDIUM
    description: >
      Observed JVM GC pause exceeds assessment.performance.gc-pause-warning-ms.
    impact: >
      Stop-the-world pauses can increase authentication latency.
    recommendation: >
      Review heap sizing and allocation patterns. Do not infer a memory leak from this signal alone.
    references: []
    condition:
      key: metrics.jvm.gcPauseExceeded
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.jvm.gcPauseExceeded
        - metrics.jvm.gcPauseMaxMs

  - id: KC-PERF-CLUSTER-001
    title: Keycloak cluster size differs from ready replicas
    category: performance
    severity: MEDIUM
    description: >
      Metrics cluster membership size differs from infrastructure ready replicas.
      This is a correlated visibility/membership signal, not a root cause.
    impact: >
      Inconsistent cluster view may affect cache invalidation and failover behavior.
    recommendation: >
      Compare Keycloak cluster metrics with workload readyReplicas and recent pod restarts.
    references: []
    condition:
      key: metrics.cluster.sizeMismatch
      equals: true
    appliesWhen:
      evidenceRequired:
        - metrics.cluster.size
        - metrics.cluster.readyReplicas
        - metrics.cluster.sizeMismatch
