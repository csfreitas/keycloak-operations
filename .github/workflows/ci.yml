name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean verify

  community-keycloak-integration:
    runs-on: ubuntu-latest
    needs: unit-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Community Keycloak IT (optional)
        env:
          RUN_KEYCLOAK_IT: "true"
        run: mvn -B -Dtest=KeycloakCommunity26_7IT,KeycloakCommunity26_6IT test
        continue-on-error: true
