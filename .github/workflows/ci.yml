name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean verify

  ui-unit-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test and build
        run: npm run test:run && npm run build

  community-keycloak-integration:
    runs-on: ubuntu-latest
    needs: [unit-and-build, ui-unit-and-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start PostgreSQL, Keycloak 26.7.1, and Prometheus
        run: docker compose -f dev/compose.yaml up -d --wait postgres keycloak prometheus
      - name: Configure the Keycloak service account
        run: ./scripts/setup-dev.sh
      - name: Build the application
        run: mvn -B -DskipTests package
      - name: Run disposable Community Keycloak integration tests
        env:
          RUN_KEYCLOAK_IT: "true"
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_CLIENT_SECRET: change-me
        run: mvn -B -Dit.test=KeycloakCommunity26_7IT,ControlledClientChangeIT failsafe:integration-test failsafe:verify
      - name: Start the application
        env:
          POSTGRES_JDBC_URL: jdbc:postgresql://localhost:5432/kcops
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_CLIENT_SECRET: change-me
          PLATFORM_METRICS_PROMETHEUS_ENDPOINT: http://localhost:9090
        run: |
          java -jar target/quarkus-app/quarkus-run.jar > target/community-smoke-app.log 2>&1 &
          echo $! > target/community-smoke-app.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9001/q/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat target/community-smoke-app.log
          exit 1
      - name: Run MCP community smoke test
        run: ./scripts/smoke-mcp.sh
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-keycloak-smoke-logs
          path: |
            target/community-smoke-app.log
          if-no-files-found: ignore
      - name: Stop disposable services
        if: always()
        run: |
          if test -f target/community-smoke-app.pid; then
            kill "$(cat target/community-smoke-app.pid)" 2>/dev/null || true
          fi
          docker compose -f dev/compose.yaml down -v
