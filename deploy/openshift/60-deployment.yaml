apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-operations-mcp
  namespace: keycloak-mcp
  labels:
    app.kubernetes.io/name: keycloak-operations-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-operations-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-operations-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: keycloak-mcp-assessor
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: quay.io/keycloakmcp/keycloak-operations-mcp:0.6.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: management
              containerPort: 9001
              protocol: TCP
          envFrom:
            - secretRef:
                name: keycloak-mcp-credentials
          env:
            - name: DISCOVERY_KUBERNETES_ENABLED
              value: "true"
            - name: DISCOVERY_OPENSHIFT_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /deployments/config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: keycloak-mcp-config
