# TEMPLATE — do not commit real credentials.
# Create with:
#   oc create secret generic keycloak-mcp-credentials \
#     -n keycloak-mcp \
#     --from-literal=KEYCLOAK_URL='https://keycloak.example.com' \
#     --from-literal=KEYCLOAK_CLIENT_ID='keycloak-mcp' \
#     --from-literal=KEYCLOAK_CLIENT_SECRET='REPLACE_ME' \
#     --from-literal=KEYCLOAK_AUTH_REALM='master'
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-mcp-credentials
  namespace: keycloak-mcp
  labels:
    app.kubernetes.io/name: keycloak-operations-mcp
type: Opaque
stringData:
  KEYCLOAK_URL: "https://REPLACE_WITH_KEYCLOAK_URL"
  KEYCLOAK_AUTH_REALM: "master"
  KEYCLOAK_CLIENT_ID: "keycloak-mcp"
  KEYCLOAK_CLIENT_SECRET: "REPLACE_WITH_CLIENT_SECRET"
---
# Identity A validates callers; never reuse the target administration client/secret above.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-operations-platform-identity
  namespace: keycloak-mcp
type: Opaque
stringData:
  OIDC_AUTH_SERVER_URL: "https://REPLACE_WITH_PLATFORM_IDP/realms/operations"
  OIDC_CLIENT_ID: "keycloak-operations"
  OIDC_AUDIENCE: "keycloak-operations"
  OIDC_ROLE_CLAIM_PATH: "realm_access/roles"
  OIDC_CLIENT_SECRET: "REPLACE_WITH_PLATFORM_OIDC_CLIENT_SECRET_IF_REQUIRED"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-operations-database
  namespace: keycloak-mcp
type: Opaque
stringData:
  POSTGRES_JDBC_URL: "jdbc:postgresql://REPLACE_WITH_POSTGRES_SERVICE:5432/kcops"
  POSTGRES_USER: "kcops"
  POSTGRES_PASSWORD: "REPLACE_WITH_DATABASE_PASSWORD"
