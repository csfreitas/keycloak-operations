apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-operations-mcp
  namespace: keycloak-mcp
  labels:
    app.kubernetes.io/name: keycloak-operations-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-operations-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow MCP HTTP from same namespace and from OpenShift router namespaces
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8081
    # Management / metrics — restrict to same namespace by default
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9001
  egress:
    # Adapt these exact selectors to the provisioned database; no database is created by this template.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_WITH_POSTGRES_NAMESPACE
          podSelector:
            matchLabels:
              app.kubernetes.io/name: REPLACE_WITH_POSTGRES_APP_LABEL
      ports:
        - protocol: TCP
          port: 5432
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
    # Kubernetes API
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Keycloak / external HTTPS (tighten to specific CIDRs or namespaces in production)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
