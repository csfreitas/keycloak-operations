apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keycloak-mcp-assessor
  labels:
    app.kubernetes.io/name: keycloak-operations-mcp
  annotations:
    description: >
      Read-only cluster-scoped access for environment discovery.
      Workload resources should preferably be granted via a namespaced Role.
      Cluster scope is required for nodes, OpenShift cluster config, and API discovery.
rules:
  # Cluster-scoped: node topology / capacity for zone distribution assessments.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Cluster-scoped: namespace discovery (optional; prefer known Target namespace).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # OpenShift cluster identity (version / platform). Not available as namespaced resources.
  - apiGroups: ["config.openshift.io"]
    resources:
      - clusterversions
      - infrastructures
      - networks
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-mcp-assessor
  namespace: keycloak-mcp
  labels:
    app.kubernetes.io/name: keycloak-operations-mcp
  annotations:
    description: >
      Namespaced read-only access for Keycloak/RHBK workload inventory.
      Bind this Role in each Target namespace (not only keycloak-mcp).
      Secrets are intentionally omitted — secret contents are never collected.
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "serviceaccounts", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operator.openshift.io"]
    resources: ["ingresscontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.keycloak.org"]
    resources: ["keycloaks", "keycloakrealmimports"]
    verbs: ["get", "list", "watch"]
