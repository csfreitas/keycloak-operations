apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak-operations-mcp
  namespace: keycloak-mcp
  labels:
    app.kubernetes.io/name: keycloak-operations-mcp
spec:
  to:
    kind: Service
    name: keycloak-operations-mcp
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
