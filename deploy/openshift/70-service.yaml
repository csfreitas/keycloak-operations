apiVersion: v1
kind: Service
metadata:
  name: keycloak-operations-mcp
  namespace: keycloak-mcp
  labels:
    app.kubernetes.io/name: keycloak-operations-mcp
spec:
  selector:
    app.kubernetes.io/name: keycloak-operations-mcp
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: management
      port: 9001
      targetPort: management
      protocol: TCP
