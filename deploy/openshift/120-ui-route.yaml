apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak-operations-ui
  namespace: keycloak-mcp
  labels:
    app.kubernetes.io/name: keycloak-operations-ui
spec:
  to:
    kind: Service
    name: keycloak-operations-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
